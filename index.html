<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>雷霆记账</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        background: linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #1f2937;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #splash { text-align: center; animation: fadeIn 0.3s ease-in; }
      .logo {
        width: 72px; height: 72px;
        background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        border-radius: 18px;
        margin: 0 auto 16px;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 10px 25px rgba(245, 158, 11, 0.3);
        animation: pulse 1.5s ease-in-out infinite;
      }
      .logo svg { width: 38px; height: 38px; color: white; }
      h1 { margin: 0 0 6px; font-size: 18px; font-weight: 600; color: #111827; }
      p { margin: 0; font-size: 13px; color: #6b7280; }
      .dots { margin-top: 12px; }
      .dots span {
        display: inline-block;
        width: 6px; height: 6px;
        background: #f59e0b;
        border-radius: 50%;
        margin: 0 3px;
        opacity: 0.4;
        animation: blink 1.4s ease-in-out infinite;
      }
      .dots span:nth-child(2) { animation-delay: 0.2s; }
      .dots span:nth-child(3) { animation-delay: 0.4s; }
      #root { display: none; }
      body.ready #splash { opacity: 0; pointer-events: none; }
      body.ready #root { display: block; }
      @keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }
      @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      #splash { transition: opacity 0.3s ease-out; }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
      </div>
      <h1>雷霆记账</h1>
      <p>正在加载...</p>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
